name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and never cancel one midway: a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site is the demo people judge the library by, so it does not ship
      # unless the library it demonstrates actually passes.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:site
      # `enablement` turns Pages on for the repository if it is not already,
      # instead of failing with "Get Pages site failed". Without it the first
      # run of this workflow on a fresh repository always fails, and the fix is
      # a setting nobody reading the log would think to look for.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
